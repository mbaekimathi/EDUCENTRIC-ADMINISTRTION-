{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{% if school_profile %}{{ school_profile.brand_accent }}{% else %}#0f4fd6{% endif %}">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Edu-Centric{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  </noscript>
  <link rel="preload" href="{% static 'css/app.css' %}?v={{ app_css_version|default:'20261009marking2' }}" as="style">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ app_css_version|default:'20261009marking2' }}">
  {% block logo_preload %}{% endblock %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f4fd6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='Arial,sans-serif' font-weight='700' fill='white'%3EE%3C/text%3E%3C/svg%3E">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"{% if school_profile %} style="--school-accent: {{ school_profile.brand_accent }}; --blue: {{ school_profile.brand_accent }};"{% endif %}{% block body_attrs %}{% endblock %}>
  {% block content %}{% endblock %}
  {% include "partials/app_notifications.html" %}
  <script src="{% static 'js/notifications.js' %}?v=20260902notify" defer></script>
  <script src="{% static 'js/core.js' %}?v=20260902perf" defer></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
