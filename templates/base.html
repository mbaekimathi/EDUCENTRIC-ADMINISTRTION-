{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4fd6">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Edu-Centric{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  </noscript>
  <link rel="preload" href="{% static 'css/app.css' %}?v=20260904pending" as="style">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20260904pending">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% include "partials/app_notifications.html" %}
  <script src="{% static 'js/notifications.js' %}?v=20260902notify" defer></script>
  <script src="{% static 'js/core.js' %}?v=20260902perf" defer></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
