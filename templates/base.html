{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4fd6">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Edu-Centric{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20260825role-chips-fix">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  <script>
    document.addEventListener("input", function (event) {
      const target = event.target;
      if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)) return;
      if (target.type === "email" || target.type === "password" || target.type === "file" || target.type === "checkbox" || target.type === "hidden" || target.type === "number" || target.type === "tel" || target.type === "date") return;
      const forceUpper = target.classList.contains("uppercase-input") || Boolean(target.closest("[data-grade-form]"));
      if (!forceUpper) return;
      const upper = target.value.toUpperCase();
      if (upper === target.value) return;
      if (typeof target.selectionStart === "number") {
        const start = target.selectionStart;
        const end = target.selectionEnd;
        target.value = upper;
        try { target.setSelectionRange(start, end); } catch (error) {}
      } else {
        target.value = upper;
      }
    });

    document.addEventListener("click", function (event) {
      const button = event.target.closest(".password-toggle");
      if (!button) return;
      const wrap = button.closest(".password-input");
      const input = wrap ? wrap.querySelector("input") : button.previousElementSibling;
      if (!(input instanceof HTMLInputElement)) return;
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      button.classList.toggle("is-visible", show);
      button.setAttribute("aria-pressed", show ? "true" : "false");
      button.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  </script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
