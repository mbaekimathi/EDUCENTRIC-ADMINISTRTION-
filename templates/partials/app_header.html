<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="{{ brand_href }}">
      <span class="brand-mark">E</span>
      <span class="brand-text">Edu-Centric</span>
    </a>
    <div class="app-header-actions">
      {% if nav_href %}<a class="text-link header-nav" href="{{ nav_href }}">{{ nav_label }}</a>{% endif %}
      {% if user_label %}<span class="user-chip" title="{{ user_label }}">{{ user_label }}</span>{% endif %}
      {% if action_href %}<a class="ghost-button" href="{{ action_href }}">{{ action_label }}</a>{% endif %}
    </div>
  </div>
</header>
