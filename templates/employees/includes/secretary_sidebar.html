<p class="workspace-nav-label">Modules</p>
<a
  class="workspace-nav-link {% if active_nav == 'dashboard' and active_module != 'reports' %}is-active{% endif %}"
  href="{% url 'employees:role_dashboard' role='secretary' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4v-9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </span>
  Dashboard
</a>
{% if admissions_enabled %}
<a
  class="workspace-nav-link"
  href="{% url 'admissions:admit_student' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </span>
  Admit student
</a>
{% endif %}
<a
  class="workspace-nav-link {% if active_module == 'reports' %}is-active{% endif %}"
  href="{% url 'employees:secretary_reports' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M6 20V10m6 10V4m6 16v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </span>
  Reports
</a>
