{% if workspace_role == "SECRETARY" %}
<p class="workspace-nav-label">Modules</p>
<a
  class="workspace-nav-link"
  href="{% url 'employees:role_dashboard' role='secretary' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4v-9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </span>
  Dashboard
</a>
<a
  class="workspace-nav-link {% if not active_exam_tool %}is-active{% endif %}"
  href="{% url 'employees:secretary_assessment_management' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </span>
  Assessment overview
</a>
{% endif %}
<p class="workspace-nav-label">Assessment</p>
<a
  class="workspace-nav-link {% if active_exam_tool == 'allocate-supervisors' %}is-active{% endif %}"
  href="{% url exam_page_url 'allocate-supervisors' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5V5zm3 3h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
  Allocate supervisors
</a>
<a
  class="workspace-nav-link {% if active_exam_tool == 'exam-timetable-generation' %}is-active{% endif %}"
  href="{% url exam_page_url 'exam-timetable-generation' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14v15H5V5zM8 13h3M13 13h3M8 17h3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
  Generate assessment timetable
</a>
<a
  class="workspace-nav-link {% if active_exam_tool == 'exam-records' %}is-active{% endif %}"
  href="{% url exam_page_url 'exam-records' %}"
>
  <span class="workspace-nav-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7V3zm8 0v4h4M9 12h8M9 16h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
  All assessments
</a>
