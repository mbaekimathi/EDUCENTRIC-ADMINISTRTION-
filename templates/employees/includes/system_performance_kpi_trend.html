{% if trend %}
<div class="sys-perf-kpi__trend" aria-hidden="true">
  <svg viewBox="0 0 {{ trend.width }} {{ trend.height }}" preserveAspectRatio="none">
    <polygon class="sys-perf-kpi__trend-area" points="{{ trend.area }}"></polygon>
    <polyline class="sys-perf-kpi__trend-line" points="{{ trend.line }}" fill="none"></polyline>
  </svg>
</div>
{% endif %}
