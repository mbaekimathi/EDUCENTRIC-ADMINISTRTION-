<script>
(function () {
  document.querySelectorAll("[data-exam-marks]").forEach(function (form) {
    const sheetRoot =
      form.closest(".marks-card") ||
      form.closest(".it-marks-sheet") ||
      form.closest(".teacher-marks-sheet") ||
      form;
    const editButton = sheetRoot.querySelector("[data-exam-edit]");
    const cancelButton = sheetRoot.querySelector("[data-exam-cancel]");
    const saveButton = sheetRoot.querySelector("[data-exam-save]");
    const inputs = form.querySelectorAll(".exam-mark-input");

    function syncOutOfAttributes(preferSaved) {
      inputs.forEach(function (input) {
        const saved = input.getAttribute("data-saved-out-of");
        const current = input.getAttribute("data-current-out-of");
        const value = preferSaved ? saved || current : current || saved;
        if (!value) return;
        input.setAttribute("data-out-of", value);
        // Teacher / e-learning sheets use subject out-of as max; IT sheets stay at 100.
        if (input.getAttribute("max") !== "100") {
          input.setAttribute("max", value);
        }
      });
      form.querySelectorAll("[data-exam-mark]").forEach(function (input) {
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
    }

    function setEditing(editing) {
      form.classList.toggle("is-editing", editing);
      inputs.forEach(function (input) {
        input.readOnly = !editing;
      });
      if (editButton) editButton.hidden = editing;
      if (cancelButton) cancelButton.hidden = !editing;
      if (saveButton) saveButton.hidden = !editing;
      syncStickyOffset();
    }

    const bar = sheetRoot.querySelector(".exam-record-bar");
    function syncStickyOffset() {
      if (!bar) return;
      form.style.setProperty("--exam-record-bar-h", `${bar.offsetHeight}px`);
      sheetRoot.style.setProperty("--exam-record-bar-h", `${bar.offsetHeight}px`);
    }
    if (typeof ResizeObserver === "function" && bar) {
      new ResizeObserver(syncStickyOffset).observe(bar);
    }
    window.addEventListener("resize", syncStickyOffset);

    const scrollPanel = form.querySelector(".teacher-marks-table-scroll")
      || form.querySelector(".it-marks-table-scroll")
      || form.querySelector(".exam-record-sheet-table");
    const meanScroll = form.querySelector(".teacher-marks-mean-scroll")
      || form.querySelector(".it-marks-mean-scroll");
    const tablePanel = form.querySelector(".teacher-marks-table-panel")
      || form.querySelector(".it-marks-table-panel");
    const mainTable = scrollPanel?.querySelector(".exam-record-students-table");
    const meanTable = form.querySelector(".teacher-marks-mean-table")
      || form.querySelector(".it-marks-mean-table");
    const sheet = sheetRoot;
    const fillCardSheet = Boolean(sheet && sheet.classList.contains("marks-workbench"));
    const compactNameSheet = Boolean(sheet && mainTable && !fillCardSheet);
    const COLLAPSE_AT = 20;
    const EXPAND_AT = 2;
    let nameCollapsed = false;
    // After collapse, browser may clamp scrollLeft to 0. Hold expand briefly so we
    // don't shake — cleared as soon as the user scrolls left (or right past a few px).
    let holdExpandAtOrigin = false;
    let ignoreExpandUntil = 0;
    let cachedFirstMin = 0;
    let spacerPx = 0;
    let scrollRaf = 0;
    let lastScrollX = 0;

    function isMobileMarksViewport() {
      return window.matchMedia("(max-width: 720px)").matches;
    }

    function nameColExtraPx() {
      // Extra room beyond first name when showing the full name at rest.
      if (window.matchMedia("(max-width: 480px)").matches) return 7 * 16;
      if (isMobileMarksViewport()) return 9 * 16;
      return 12 * 16;
    }

    function cellPadPx() {
      if (window.matchMedia("(max-width: 480px)").matches) return 14;
      if (isMobileMarksViewport()) return 16;
      return 24;
    }

    function measureFirstNameMinPx() {
      if (!mainTable) return 0;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      if (!ctx) return 0;
      let max = 0;
      let fontSet = false;
      mainTable.querySelectorAll(".exam-student-first").forEach(function (el) {
        if (!fontSet) {
          const cs = window.getComputedStyle(el);
          ctx.font = cs.font || `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
          fontSet = true;
        }
        const text = (el.textContent || "").replace(/\s+/g, " ").trim().toUpperCase();
        if (!text) return;
        max = Math.max(max, ctx.measureText(text).width);
      });
      return max > 0 ? Math.ceil(max + cellPadPx()) : 0;
    }

    function measureExpandedNamePx() {
      if (!mainTable) return 0;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      if (!ctx) return 0;
      let max = 0;
      let fontSet = false;
      mainTable.querySelectorAll(".exam-student-name").forEach(function (el) {
        if (!fontSet) {
          const cs = window.getComputedStyle(el);
          ctx.font = cs.font || `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
          fontSet = true;
        }
        const parts = [];
        el.querySelectorAll(".exam-student-first, .exam-student-middle, .exam-student-last").forEach(function (part) {
          const t = (part.textContent || "").replace(/\s+/g, " ").trim();
          if (t) parts.push(t);
        });
        const text = parts.join(" ").toUpperCase();
        if (!text) return;
        max = Math.max(max, ctx.measureText(text).width);
      });
      const firstMin = cachedFirstMin || measureFirstNameMinPx();
      const measured = max > 0 ? Math.ceil(max + cellPadPx()) : 0;
      // Prefer the real full-name width; only fall back to first+extra if measure failed.
      if (measured) return measured;
      return firstMin ? firstMin + nameColExtraPx() : 0;
    }

    function remeasureFirstNames() {
      cachedFirstMin = measureFirstNameMinPx();
      const root = sheet || form;
      const firstMin = cachedFirstMin;
      const colMax = firstMin ? measureExpandedNamePx() : 0;
      if (firstMin) {
        root.style.setProperty("--exam-name-first-min", `${firstMin}px`);
        root.style.setProperty("--exam-name-col-max", `${colMax}px`);
        root.style.setProperty(
          "--exam-name-col-width",
          `${nameCollapsed ? firstMin : colMax}px`
        );
      } else {
        root.style.removeProperty("--exam-name-first-min");
        root.style.removeProperty("--exam-name-col-max");
        root.style.removeProperty("--exam-name-col-width");
      }
      return cachedFirstMin;
    }

    function currentScrollX() {
      return scrollPanel ? scrollPanel.scrollLeft || 0 : 0;
    }

    function canScrollX() {
      if (!scrollPanel) return false;
      return scrollPanel.scrollWidth > scrollPanel.clientWidth + 2;
    }

    function nameCells() {
      if (!mainTable) return [];
      return Array.from(mainTable.querySelectorAll("tr > :first-child"));
    }

    function ensureScrollTrack() {
      if (!scrollPanel || !mainTable) return null;
      let track = scrollPanel.querySelector(":scope > .exam-marks-scroll-track");
      if (track && mainTable.parentElement === track) return track;
      track = document.createElement("div");
      track.className = "exam-marks-scroll-track";
      scrollPanel.insertBefore(track, mainTable);
      track.appendChild(mainTable);
      return track;
    }

    function ensureNameCol() {
      if (!mainTable) return null;
      let cg = mainTable.querySelector(":scope > colgroup[data-exam-cols]");
      const headCells = mainTable.querySelector("thead tr")?.children;
      const colCount = headCells ? headCells.length : 0;
      if (!colCount) return null;
      if (!cg || cg.children.length !== colCount) {
        if (cg) cg.remove();
        cg = document.createElement("colgroup");
        cg.setAttribute("data-exam-cols", "1");
        for (let i = 0; i < colCount; i += 1) {
          const col = document.createElement("col");
          if (i === 0) col.setAttribute("data-exam-name-col", "1");
          if (i === 1) col.setAttribute("data-exam-admit-col", "1");
          cg.appendChild(col);
        }
        mainTable.insertBefore(cg, mainTable.firstChild);
      }
      return cg.querySelector("[data-exam-name-col]");
    }

    function applyNameCellWidths(collapsed) {
      const firstMin = cachedFirstMin || remeasureFirstNames();
      if (!firstMin) {
        nameCells().forEach(function (cell) {
          cell.style.removeProperty("width");
          cell.style.removeProperty("min-width");
          cell.style.removeProperty("max-width");
        });
        const nameCol = ensureNameCol();
        if (nameCol) {
          nameCol.style.width = "";
          nameCol.style.minWidth = "";
          nameCol.style.maxWidth = "";
        }
        return;
      }
      // CSS colgroup owns layout for marks-card sheets.
      if (fillCardSheet) {
        if (mainTable) {
          mainTable.style.removeProperty("table-layout");
          mainTable.style.removeProperty("width");
          mainTable.style.removeProperty("min-width");
          mainTable.style.removeProperty("max-width");
        }
        nameCells().forEach(function (cell) {
          cell.style.removeProperty("width");
          cell.style.removeProperty("min-width");
          cell.style.removeProperty("max-width");
        });
        return;
      }
      // Collapsed: hug first name. Expanded: fit full name. Never leave empty sticky space.
      const colW = collapsed ? firstMin : measureExpandedNamePx();
      const root = sheet || form;
      root.style.setProperty("--exam-name-col-width", `${colW}px`);
      root.style.setProperty("--exam-name-first-min", `${firstMin}px`);
      root.style.setProperty("--exam-name-col-max", `${colW}px`);
      mainTable.style.tableLayout = "auto";
      mainTable.style.width = "max-content";
      mainTable.style.minWidth = "0";
      mainTable.style.maxWidth = "none";
      const nameCol = ensureNameCol();
      if (nameCol) {
        nameCol.style.setProperty("width", `${colW}px`);
        nameCol.style.setProperty("min-width", `${colW}px`);
        nameCol.style.setProperty("max-width", `${colW}px`);
      }
      const admitCol = mainTable.querySelector("[data-exam-admit-col]");
      if (admitCol) {
        if (collapsed) {
          admitCol.style.width = "0px";
          admitCol.style.minWidth = "0px";
          admitCol.style.maxWidth = "0px";
        } else {
          admitCol.style.width = "";
          admitCol.style.minWidth = "";
          admitCol.style.maxWidth = "";
        }
      }
      nameCells().forEach(function (cell) {
        cell.style.setProperty("width", `${colW}px`, "important");
        cell.style.setProperty("min-width", `${colW}px`, "important");
        cell.style.setProperty("max-width", `${colW}px`, "important");
        cell.style.boxSizing = "border-box";
      });
    }

    function setScrollSpacer(px) {
      // Fill-card sheets must stay inside the card — never inject an external spacer.
      if (fillCardSheet) {
        spacerPx = 0;
        if (!scrollPanel || !mainTable) return;
        const track = scrollPanel.querySelector(":scope > .exam-marks-scroll-track");
        const spacer = track && track.querySelector(":scope > [data-exam-x-spacer]");
        if (spacer) {
          spacer.style.width = "0px";
          spacer.style.minWidth = "0px";
        }
        return;
      }
      // Spacer sits BESIDE the table (not inside it) so scrollWidth is preserved
      // without stretching the sticky name column.
      spacerPx = Math.max(0, Math.round(px || 0));
      if (!scrollPanel || !mainTable) return;
      mainTable.style.minWidth = "";
      mainTable.style.paddingInlineEnd = "";
      mainTable.style.boxSizing = "";
      const track = ensureScrollTrack();
      if (!track) return;
      let spacer = track.querySelector(":scope > [data-exam-x-spacer]");
      if (!spacer) {
        spacer = document.createElement("div");
        spacer.setAttribute("data-exam-x-spacer", "1");
        spacer.setAttribute("aria-hidden", "true");
        track.appendChild(spacer);
      }
      spacer.style.width = spacerPx ? `${spacerPx}px` : "0px";
      spacer.style.minWidth = spacer.style.width;
      spacer.style.flex = "0 0 auto";
      spacer.style.height = "1px";
      spacer.style.pointerEvents = "none";
      spacer.style.alignSelf = "stretch";
    }

    function syncMeanBarWidth() {
      if (!mainTable || !meanTable) return;
      if (fillCardSheet) {
        meanTable.style.tableLayout = "fixed";
        meanTable.style.width = "100%";
        meanTable.style.minWidth = "100%";
        meanTable.style.maxWidth = "100%";
      } else {
        const tableW = Math.max(mainTable.scrollWidth, mainTable.offsetWidth) + spacerPx;
        meanTable.style.tableLayout = "auto";
        meanTable.style.width = `${tableW}px`;
        meanTable.style.minWidth = "0";
        meanTable.style.maxWidth = "none";
      }
      meanTable.style.paddingInlineEnd = "";
      meanTable.style.boxSizing = "";
      const colW = cachedFirstMin
        ? nameCollapsed
          ? cachedFirstMin
          : measureExpandedNamePx()
        : 0;
      const meanName = meanTable.querySelector("tr > :first-child");
      const meanAdmit = meanTable.querySelector("tr > :nth-child(2)");
      if (meanName && colW) {
        meanName.style.setProperty("width", `${colW}px`, "important");
        meanName.style.setProperty("min-width", `${colW}px`, "important");
        meanName.style.setProperty("max-width", `${colW}px`, "important");
        meanName.style.boxSizing = "border-box";
      }
      if (meanAdmit) {
        if (nameCollapsed) {
          meanAdmit.style.width = "0";
          meanAdmit.style.minWidth = "0";
          meanAdmit.style.maxWidth = "0";
          meanAdmit.style.padding = "0";
          meanAdmit.style.border = "0";
          meanAdmit.style.overflow = "hidden";
        } else {
          meanAdmit.style.width = "6.5rem";
          meanAdmit.style.minWidth = "6.5rem";
          meanAdmit.style.maxWidth = "6.5rem";
          meanAdmit.style.padding = "";
          meanAdmit.style.border = "";
          meanAdmit.style.overflow = "";
        }
      }
    }

    function syncMeanBarScroll() {
      if (!meanScroll || !scrollPanel) return;
      if (meanScroll.scrollLeft !== scrollPanel.scrollLeft) {
        meanScroll.scrollLeft = scrollPanel.scrollLeft;
      }
    }

    function applyNameCollapsedClass(collapsed) {
      if (!mainTable) return;
      mainTable.classList.toggle("is-name-collapsed", collapsed);
      if (meanTable) meanTable.classList.toggle("is-name-collapsed", collapsed);
      if (sheet) sheet.classList.toggle("is-name-collapsed", collapsed);
      form.classList.toggle("is-name-collapsed", collapsed);
    }

    function setNameCollapsed(next) {
      if (!compactNameSheet || !mainTable || !scrollPanel) return;
      if (next === nameCollapsed) return;

      if (next) {
        // Measure full scroll width, collapse name band, then add an external
        // spacer so overflow (and scroll-back) remains without widening the name col.
        setScrollSpacer(0);
        const widthBefore = scrollPanel.scrollWidth;
        const scrollBefore = currentScrollX();
        nameCollapsed = true;
        applyNameCollapsedClass(true);
        applyNameCellWidths(true);
        void mainTable.offsetWidth;
        const widthAfter = scrollPanel.scrollWidth;
        setScrollSpacer(Math.max(0, widthBefore - widthAfter));
        // Keep the user's place if the browser clamped during shrink.
        if (scrollPanel.scrollLeft < scrollBefore) {
          scrollPanel.scrollLeft = Math.min(
            scrollBefore,
            Math.max(0, scrollPanel.scrollWidth - scrollPanel.clientWidth)
          );
        }
      } else {
        nameCollapsed = false;
        setScrollSpacer(0);
        applyNameCollapsedClass(false);
        applyNameCellWidths(false);
      }
      syncMeanBarWidth();
      syncMeanBarScroll();

      if (next) {
        ignoreExpandUntil = performance.now() + 180;
        requestAnimationFrame(function () {
          if (nameCollapsed && currentScrollX() <= EXPAND_AT) {
            // Only latch if there is still room to scroll — otherwise we'd trap
            // the user with no way to clear the hold.
            holdExpandAtOrigin = canScrollX();
          }
        });
      } else {
        holdExpandAtOrigin = false;
        ignoreExpandUntil = 0;
      }
    }

    function updateScrolledChrome(x) {
      const scrolled = x > 2;
      if (tablePanel) tablePanel.classList.toggle("is-scrolled-x", scrolled);
      if (scrollPanel) scrollPanel.classList.toggle("is-scrolled-x", scrolled);
      if (sheet) sheet.classList.toggle("is-scrolled-x", scrolled);
    }

    function syncNameCollapse() {
      if (!compactNameSheet || !scrollPanel) return;

      const x = currentScrollX();
      const scrollingLeft = x < lastScrollX - 0.5;
      const scrollingRight = x > lastScrollX + 0.5;

      // Scrolling left always frees expand. Scrolling further right also clears
      // the post-collapse origin latch.
      if (nameCollapsed && (scrollingLeft || (scrollingRight && x > EXPAND_AT + 6))) {
        holdExpandAtOrigin = false;
      }

      // Stuck collapsed with no horizontal overflow — restore full names.
      if (nameCollapsed && holdExpandAtOrigin && !canScrollX()) {
        holdExpandAtOrigin = false;
        setNameCollapsed(false);
        lastScrollX = currentScrollX();
        updateScrolledChrome(lastScrollX);
        syncMeanBarScroll();
        return;
      }

      if (!nameCollapsed && x >= COLLAPSE_AT) {
        setNameCollapsed(true);
      } else if (
        nameCollapsed &&
        x <= EXPAND_AT &&
        !holdExpandAtOrigin &&
        performance.now() >= ignoreExpandUntil
      ) {
        setNameCollapsed(false);
      }

      lastScrollX = currentScrollX();
      updateScrolledChrome(lastScrollX);
      syncMeanBarScroll();
    }

    function onScrollPanelScroll() {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(function () {
        scrollRaf = 0;
        syncNameCollapse();
      });
    }

    function onViewportChange() {
      remeasureFirstNames();
      applyNameCollapsedClass(nameCollapsed);
      applyNameCellWidths(nameCollapsed);
      if (nameCollapsed) {
        setScrollSpacer(0);
        const collapsedW = scrollPanel ? scrollPanel.scrollWidth : 0;
        applyNameCollapsedClass(false);
        applyNameCellWidths(false);
        const expandedW = scrollPanel ? scrollPanel.scrollWidth : collapsedW;
        applyNameCollapsedClass(true);
        applyNameCellWidths(true);
        setScrollSpacer(Math.max(0, expandedW - collapsedW));
      } else {
        setScrollSpacer(0);
      }
      syncMeanBarWidth();
      lastScrollX = currentScrollX();
      updateScrolledChrome(lastScrollX);
      syncMeanBarScroll();
    }

    if (compactNameSheet && scrollPanel) {
      ensureScrollTrack();
      scrollPanel.addEventListener("scroll", onScrollPanelScroll, { passive: true });
      window.addEventListener("resize", onViewportChange);
      if (typeof ResizeObserver === "function") {
        let lastPortWidth = scrollPanel.clientWidth;
        new ResizeObserver(function () {
          const portWidth = scrollPanel.clientWidth;
          if (portWidth === lastPortWidth) {
            syncMeanBarWidth();
            syncMeanBarScroll();
            return;
          }
          lastPortWidth = portWidth;
          onViewportChange();
        }).observe(scrollPanel);
      }
      remeasureFirstNames();
      // Always show full names at rest; collapse only after scrolling right.
      nameCollapsed = false;
      holdExpandAtOrigin = false;
      setScrollSpacer(0);
      applyNameCollapsedClass(false);
      applyNameCellWidths(false);
      syncMeanBarWidth();
      lastScrollX = 0;
      updateScrolledChrome(0);
      syncMeanBarScroll();
    } else if (fillCardSheet && form) {
      // Layout is CSS-owned (desktop fill / mobile horizontal scroll).
      // Do not clamp width/max-width inline — that collapses subject columns on phones.
      const cardTable = form.querySelector(".marks-card-table");
      if (cardTable) {
        cardTable.style.removeProperty("width");
        cardTable.style.removeProperty("max-width");
        cardTable.style.removeProperty("min-width");
        cardTable.style.removeProperty("table-layout");
      }
    }

    setEditing(false);

    editButton?.addEventListener("click", function () {
      syncOutOfAttributes(false);
      setEditing(true);
      focusMark(form.querySelector(".exam-mark-input"));
    });

    cancelButton?.addEventListener("click", function () {
      form.reset();
      syncOutOfAttributes(true);
      setEditing(false);
    });

    form.addEventListener("submit", function (event) {
      if (!form.classList.contains("is-editing")) {
        event.preventDefault();
        return;
      }
      if (form.getAttribute("data-out-of-changed") === "1") {
        const confirmed = window.confirm(
          "Out-of marks settings have changed since some scores were saved. " +
            "Saving will apply the current out-of values to these marks. Continue?"
        );
        if (!confirmed) {
          event.preventDefault();
        }
      }
    });

    function markGrid() {
      const listRows = form.querySelectorAll("[data-student-row]");
      if (listRows.length) {
        return Array.from(listRows).map(function (row) {
          return Array.from(row.querySelectorAll(".exam-mark-input"));
        });
      }
      return Array.from(form.querySelectorAll("tbody tr")).map(function (row) {
        return Array.from(row.querySelectorAll(".exam-mark-input"));
      });
    }

    function focusMark(input) {
      if (!input || input.readOnly) return;
      input.focus();
      input.select();
    }

    function inputMax(input) {
      const max = Number(input.getAttribute("max") || "100");
      return Number.isFinite(max) ? max : 100;
    }

    function setMarkValue(input, value) {
      input.value = value;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.focus();
      const end = String(input.value).length;
      // number inputs throw on setSelectionRange; text/tel/search support it
      if (typeof input.setSelectionRange === "function" && input.type !== "number") {
        input.setSelectionRange(end, end);
      }
    }

    function isFullySelected(input) {
      const text = String(input.value);
      const start = input.selectionStart;
      const end = input.selectionEnd;
      if (typeof start !== "number" || typeof end !== "number") {
        return text.length === 0;
      }
      return start === 0 && end === text.length;
    }

    function moveMark(input, rowDelta, wrapToNextColumn) {
      const grid = markGrid();
      let rowIndex = -1;
      let colIndex = -1;
      grid.some(function (row, r) {
        const c = row.indexOf(input);
        if (c === -1) return false;
        rowIndex = r;
        colIndex = c;
        return true;
      });
      if (rowIndex === -1) return null;

      let nextRow = rowIndex + rowDelta;
      let nextCol = colIndex;
      if (nextRow >= grid.length) {
        if (!wrapToNextColumn || nextCol >= grid[0].length - 1) return null;
        nextRow = 0;
        nextCol += 1;
      } else if (nextRow < 0) {
        if (!wrapToNextColumn || nextCol <= 0) return null;
        nextRow = grid.length - 1;
        nextCol -= 1;
      }
      const target = grid[nextRow] && grid[nextRow][nextCol];
      if (target) focusMark(target);
      return target || null;
    }

    function typeDigits(input, digits) {
      for (const digit of digits) {
        if (!/^\d$/.test(digit)) continue;
        const max = inputMax(input);
        const selectedAll = isFullySelected(input);
        const base = selectedAll ? "" : String(input.value).replace(/\D/g, "");
        const combined = `${base}${digit}`;
        const value = Number(combined);
        if (Number.isFinite(value) && value <= max) {
          setMarkValue(input, String(value));
          continue;
        }
        const next = moveMark(input, 1, true);
        if (!next) return;
        input = next;
        if (Number(digit) <= inputMax(next)) {
          setMarkValue(next, digit);
        }
      }
    }

    form.addEventListener("beforeinput", function (event) {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || !input.classList.contains("exam-mark-input")) {
        return;
      }
      if (input.readOnly) return;
      if (event.inputType === "insertFromPaste") {
        const digits = String(event.data || "").replace(/\D/g, "");
        event.preventDefault();
        if (digits) typeDigits(input, digits);
        return;
      }
      if (event.inputType === "insertText" && event.data && /^\d+$/.test(event.data)) {
        event.preventDefault();
        typeDigits(input, event.data);
      }
    });

    form.addEventListener("keydown", function (event) {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || !input.classList.contains("exam-mark-input")) {
        return;
      }
      if (input.readOnly) return;
      if (/^\d$/.test(event.key) && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        typeDigits(input, event.key);
        return;
      }
      if (event.key === "ArrowDown" || event.key === "Enter") {
        event.preventDefault();
        moveMark(input, 1, event.key === "Enter");
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        moveMark(input, -1, false);
      }
    });
  });
})();
</script>
