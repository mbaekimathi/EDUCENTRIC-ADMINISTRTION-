<section class="teacher-dash-actions is-nav-links" aria-label="Assessment subjects">
  <a class="teacher-dash-action" href="{% url 'employees:teacher_exam_record_detail' exam.id %}">
    <span class="teacher-dash-action-icon" aria-hidden="true">SU</span>
    <span class="teacher-dash-action-copy">
      <strong>Your subjects</strong>
      <span>Your subjects</span>
    </span>
  </a>
  <a class="teacher-dash-action" href="{% url 'employees:teacher_exam_analytics_all' exam.id %}">
    <span class="teacher-dash-action-icon" aria-hidden="true">EA</span>
    <span class="teacher-dash-action-copy">
      <strong>All classes analytics</strong>
      <span>All classes analytics</span>
    </span>
  </a>
  {% for entry in exam_class_entries %}
  <a
    class="teacher-dash-action"
    href="{% url 'employees:teacher_exam_record_class' exam.id entry.academic_class.id %}"
    title="{{ entry.subject_names }}"
  >
    <span class="teacher-dash-action-icon" aria-hidden="true">{{ entry.academic_class.code|slice:":2" }}</span>
    <span class="teacher-dash-action-copy">
      <strong class="is-uppercase">{{ entry.academic_class.display_label }}</strong>
      <span>{{ entry.subject_codes }}</span>
    </span>
  </a>
  {% endfor %}
</section>
