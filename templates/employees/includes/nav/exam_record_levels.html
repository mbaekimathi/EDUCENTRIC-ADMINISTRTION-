<section class="teacher-dash-actions is-nav-links exam-record-manage-actions" aria-label="Assessment management">
  <button type="button" class="teacher-dash-action" data-open-modal="exam-edit">
    <span class="teacher-dash-action-icon" aria-hidden="true">ED</span>
    <span class="teacher-dash-action-copy">
      <strong>Edit assessment</strong>
      <span>Edit assessment</span>
    </span>
  </button>
  {% if can_change_exam_status %}
  <button type="button" class="teacher-dash-action" data-open-modal="exam-status">
    <span class="teacher-dash-action-icon" aria-hidden="true">ST</span>
    <span class="teacher-dash-action-copy">
      <strong>Set status</strong>
      <span>Set status</span>
    </span>
  </button>
  {% endif %}
  <button type="button" class="teacher-dash-action" data-open-modal="exam-deadline">
    <span class="teacher-dash-action-icon" aria-hidden="true">DL</span>
    <span class="teacher-dash-action-copy">
      <strong>Set deadline</strong>
      <span>Set deadline</span>
    </span>
  </button>
  <button type="button" class="teacher-dash-action is-danger" data-open-modal="exam-delete">
    <span class="teacher-dash-action-icon" aria-hidden="true">DE</span>
    <span class="teacher-dash-action-copy">
      <strong>Delete assessment</strong>
      <span>Delete assessment</span>
    </span>
  </button>
</section>
<section class="teacher-dash-actions is-nav-links" aria-label="Assessment levels">
  {% for level in academic_levels %}
  <a class="teacher-dash-action" href="{% url 'employees:exam_record_level' exam.id level.id %}">
    <span class="teacher-dash-action-icon" aria-hidden="true">{{ level.code|default:level.name|slice:":2" }}</span>
    <span class="teacher-dash-action-copy">
      <strong class="is-uppercase">{{ level.name }}</strong>
      <span>{{ level.code }}</span>
    </span>
  </a>
  {% endfor %}
</section>
